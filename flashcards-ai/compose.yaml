# Levanta broker, web y worker. Supabase (base, Auth, Edge Function) y
# Vercel AI Gateway son servicios gestionados externos.
# Uso: cp .env.example .env  (completar)  y luego  docker compose up --build
x-app-env: &app-env
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false
  environment:
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configurar NEXT_PUBLIC_SUPABASE_URL en .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configurar NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY en .env}
        NEXT_PUBLIC_WORKER_WAKE_URL: ${NEXT_PUBLIC_WORKER_WAKE_URL:-}
    <<: *app-env
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configurar NEXT_PUBLIC_SUPABASE_URL en .env}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configurar NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY en .env}
        NEXT_PUBLIC_WORKER_WAKE_URL: ${NEXT_PUBLIC_WORKER_WAKE_URL:-}
    command: ["node", "worker/index.mjs"]
    <<: *app-env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
volumes:
  rabbitmq-data:
